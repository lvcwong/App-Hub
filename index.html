<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LVC App Hub</title>
<style>
  :root {
    --lime: #9cc63b;
    --lime-strong: #7fa82a;
    --lime-soft: #eef6dc;
    --tree: #5f6062;
    --bg: #f6f7f4;
    --surface: #ffffff;
    --text: #2b2c2d;
    --muted: #6e7072;
    --border: #e1e4dc;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
    --danger: #c0392b;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --lime: #a9d34a;
      --lime-strong: #bde26a;
      --lime-soft: #2a331b;
      --tree: #b9babc;
      --bg: #161718;
      --surface: #202123;
      --text: #ececec;
      --muted: #a2a4a6;
      --border: #333537;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
      --danger: #e8705f;
    }
  }
  :root[data-theme="dark"] {
    --lime: #a9d34a;
    --lime-strong: #bde26a;
    --lime-soft: #2a331b;
    --tree: #b9babc;
    --bg: #161718;
    --surface: #202123;
    --text: #ececec;
    --muted: #a2a4a6;
    --border: #333537;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    --danger: #e8705f;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    border-top: 4px solid var(--lime);
  }
  .head { display: flex; align-items: center; gap: 16px; padding: 14px 16px; }
  .logo {
    background: #fff; border-radius: 10px; padding: 4px 8px;
    display: flex; align-items: center; flex-shrink: 0;
  }
  .logo img { height: 52px; width: auto; display: block; }
  .title h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  .title p { margin: 0; color: var(--muted); font-size: 13px; }
  .head-actions { margin-left: auto; display: flex; gap: 8px; }

  button, .btn {
    font: inherit; cursor: pointer; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px;
  }
  button:hover { border-color: var(--lime); }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--lime); outline-offset: 2px;
  }
  .primary { background: var(--lime); border-color: var(--lime); color: #1d2410; font-weight: 600; }
  .primary:hover { background: var(--lime-strong); border-color: var(--lime-strong); }
  .icon-btn { padding: 7px 9px; }
  .danger { color: var(--danger); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 24px 0 16px; }
  .search {
    flex: 1 1 240px; min-width: 0;
    padding: 9px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font: inherit;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 5px 12px; border-radius: 999px; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--lime-soft); border-color: var(--lime); color: var(--text); font-weight: 600; }

  .group h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 22px 0 10px; font-weight: 600;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card {
    position: relative; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--lime); transform: translateY(-1px); }
  .card a { display: flex; gap: 12px; padding: 16px; color: inherit; text-decoration: none; border-radius: var(--radius); }
  .badge {
    width: 42px; height: 42px; border-radius: 11px; flex-shrink: 0;
    background: var(--lime-soft); color: var(--lime-strong);
    display: grid; place-items: center; font-weight: 700; font-size: 17px;
  }
  :root[data-theme="dark"] .badge { color: var(--lime); }
  .card h3 { margin: 0; font-size: 15px; }
  .card .desc { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .card .host { margin: 6px 0 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .card-tools { position: absolute; top: 8px; right: 8px; display: none; gap: 4px; }
  .editing .card-tools { display: flex; }
  .editing .card a { padding-right: 80px; }
  .card-tools button { padding: 4px 7px; font-size: 12px; }

  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  .edit-bar {
    display: none; gap: 8px; flex-wrap: wrap; align-items: center;
    background: var(--lime-soft); border: 1px solid var(--lime);
    border-radius: 10px; padding: 10px 12px; margin-top: 16px; font-size: 14px;
  }
  .editing .edit-bar { display: flex; }
  .edit-bar span { margin-right: auto; }

  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 40px 0 28px; }

  dialog {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: var(--text);
    padding: 0; width: min(440px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog form { padding: 20px; display: grid; gap: 12px; }
  dialog h2 { margin: 0 0 4px; font-size: 17px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  label input, label select {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

  @media (max-width: 560px) {
    .head { flex-wrap: wrap; padding: 12px 16px; }
    .logo img { height: 42px; }
    .head-actions { margin-left: 0; width: 100%; }
    .head-actions button { flex: 1; justify-content: center; }
  }
</style>
</head>

    <div class="title">
      <h1>App Hub</h1>
      <p>LVC EcoPack Sdn. Bhd. · all our apps in one place</p>
    </div>
    <div class="head-actions">
      <button id="themeBtn" class="icon-btn" title="Toggle light/dark" aria-label="Toggle light or dark theme">◐</button>
      <button id="editBtn" aria-pressed="false">✎ Edit</button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="edit-bar">
    <span>Edit mode: changes are saved in this browser only.</span>
    <button id="addBtn" class="primary">+ Add app</button>
    <button id="resetBtn" class="danger">Reset to defaults</button>
  </div>

  <div class="toolbar">
    <input id="search" class="search" type="search" placeholder="Search apps…" aria-label="Search apps">
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
  </div>

  <div id="list"></div>
</main>

<footer>© <span id="year"></span> LVC EcoPack Sdn. Bhd.</footer>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle">Add app</h2>
    <label>Name <input name="name" required maxlength="60"></label>
    <label>URL <input name="url" type="url" required placeholder="https://…"></label>
    <label>Category <input name="category" list="cats" maxlength="40" placeholder="e.g. HR &amp; Admin"></label>
    <datalist id="cats"></datalist>
    <label>Description <input name="desc" maxlength="120" placeholder="Optional"></label>
    <div class="dialog-actions">
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
  const STORE_KEY = 'lvc-app-hub-v3';
  const THEME_KEY = 'lvc-app-hub-theme';

  const SAMPLE = [
    { id: 'claim', name: 'Claim Form', url: 'https://claim-production-a3c4.up.railway.app/',
      category: 'HR & Admin', desc: 'Submit expense and staff claims' },
    { id: 'hr-dashboard', name: 'LVC HR Dashboard', url: 'https://lvc-dashboard-production.up.railway.app/',
      category: 'HR & Admin', desc: 'Staff records and HR overview' },
  ];

  const load = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
  const save = (key, val) => { try { localStorage.setItem(key, val); } catch {} };
  const drop = (key) => { try { localStorage.removeItem(key); } catch {} };

  let apps;
  try { apps = JSON.parse(load(STORE_KEY)) || structuredClone(SAMPLE); }
  catch { apps = structuredClone(SAMPLE); }
  if (!Array.isArray(apps)) apps = structuredClone(SAMPLE);

  let filter = 'All';
  let query = '';
  let editingId = null;

  const $ = (s) => document.querySelector(s);
  const persist = () => save(STORE_KEY, JSON.stringify(apps));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const host = (u) => { try { return new URL(u).host; } catch { return u; } };
  const initials = (n) => n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
  const categories = () => [...new Set(apps.map(a => a.category || 'Other'))].sort();

  function render() {
    const cats = categories();
    if (filter !== 'All' && !cats.includes(filter)) filter = 'All';

    $('#chips').innerHTML = ['All', ...cats].map(c =>
      `<button class="chip" aria-pressed="${c === filter}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
    $('#cats').innerHTML = cats.map(c => `<option value="${esc(c)}">`).join('');

    const q = query.toLowerCase();
    const shown = apps.filter(a =>
      (filter === 'All' || (a.category || 'Other') === filter) &&
      (!q || [a.name, a.desc, a.category, a.url].join(' ').toLowerCase().includes(q)));

    if (!shown.length) {
      $('#list').innerHTML = `<p class="empty">${apps.length ? 'No apps match your search.' : 'No apps yet. Use Edit → Add app.'}</p>`;
      return;
    }

    const groups = {};
    shown.forEach(a => (groups[a.category || 'Other'] ||= []).push(a));
    $('#list').innerHTML = Object.keys(groups).sort().map(cat => `
      <section class="group">
        <h2>${esc(cat)}</h2>
        <div class="grid">
          ${groups[cat].map(a => `
            <div class="card">
              <a href="${esc(a.url)}" target="_blank" rel="noopener">
                <div class="badge" aria-hidden="true">${esc(initials(a.name))}</div>
                <div>
                  <h3>${esc(a.name)}</h3>
                  ${a.desc ? `<p class="desc">${esc(a.desc)}</p>` : ''}
                  <p class="host">${esc(host(a.url))}</p>
                </div>
              </a>
              <div class="card-tools">
                <button data-edit="${esc(a.id)}" aria-label="Edit ${esc(a.name)}">Edit</button>
                <button data-del="${esc(a.id)}" class="danger" aria-label="Remove ${esc(a.name)}">✕</button>
              </div>
            </div>`).join('')}
        </div>
      </section>`).join('');
  }

  function openDialog(app) {
    editingId = app ? app.id : null;
    $('#dlgTitle').textContent = app ? 'Edit app' : 'Add app';
    const f = $('#form');
    f.name.value = app?.name || '';
    f.url.value = app?.url || '';
    f.category.value = app?.category || (filter !== 'All' ? filter : '');
    f.desc.value = app?.desc || '';
    $('#dlg').showModal();
    f.name.focus();
  }

  $('#form').addEventListener('submit', (e) => {
    const f = e.target;
    const data = {
      name: f.name.value.trim(),
      url: f.url.value.trim(),
      category: f.category.value.trim() || 'Other',
      desc: f.desc.value.trim(),
    };
    if (editingId) {
      Object.assign(apps.find(a => a.id === editingId), data);
    } else {
      apps.push({ id: Date.now().toString(36), ...data });
    }
    persist();
    render();
  });
  $('#cancelBtn').addEventListener('click', () => $('#dlg').close());

  $('#list').addEventListener('click', (e) => {
    const ed = e.target.closest('[data-edit]');
    const del = e.target.closest('[data-del]');
    if (ed) openDialog(apps.find(a => a.id === ed.dataset.edit));
    if (del) {
      const app = apps.find(a => a.id === del.dataset.del);
      if (confirm(`Remove "${app.name}" from the hub?`)) {
        apps = apps.filter(a => a !== app);
        persist();
        render();
      }
    }
  });

  $('#chips').addEventListener('click', (e) => {
    const c = e.target.closest('[data-cat]');
    if (c) { filter = c.dataset.cat; render(); }
  });
  $('#search').addEventListener('input', (e) => { query = e.target.value.trim(); render(); });

  $('#editBtn').addEventListener('click', () => {
    const on = document.body.classList.toggle('editing');
    $('#editBtn').setAttribute('aria-pressed', on);
    $('#editBtn').textContent = on ? '✓ Done' : '✎ Edit';
  });
  $('#addBtn').addEventListener('click', () => openDialog(null));
  $('#resetBtn').addEventListener('click', () => {
    if (confirm('Reset the app list to the defaults? Your changes in this browser will be lost.')) {
      apps = structuredClone(SAMPLE);
      drop(STORE_KEY);
      render();
    }
  });

  const savedTheme = load(THEME_KEY);
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  $('#themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    save(THEME_KEY, next);
  });

  $('#year').textContent = new Date().getFullYear();
  render();
</script>
</body>
</html>
